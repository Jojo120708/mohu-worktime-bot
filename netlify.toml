[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 全站禁用缓存：钉钉手机端 webview 会缓存 HTML/接口，导致看到旧版本或旧数据
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
